<style>
*{box-sizing:border-box}

.an-pulse{animation:pls 1.4s infinite!important}.an-bounce{animation:bnc 1s infinite!important}.an-shake{animation:shk .9s infinite!important}@keyframes pls{50%{scale:1.16}}@keyframes bnc{50%{translate:0 -30%}}@keyframes shk{25%{rotate:-7deg}75%{rotate:7deg}}.audio.ghost{opacity:0;pointer-events:none;animation:none}

.fbar{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:16px}.fbar span{font:700 22px system-ui;min-width:90px;text-align:center}.mu2{text-align:center;color:#6b7f8f;margin-top:6px}
.pimg{max-width:100%;max-height:74vh;display:block;margin:0 auto;border-radius:12px}.cap{text-align:center;font:600 clamp(18px,2.4vw,28px) system-ui;margin-top:12px}

#modal video{max-width:92vw;max-height:86vh}#modal span{position:absolute;top:14px;right:22px;font-size:36px;cursor:pointer}
</style></head><body>
<div id="cover" class="screen on"><div class="bookcover"><h1>Cambridge</h1><p>ENGLISH · INTERACTIVE BOOK</p></div><div class="hint">اضغطي لفتح الكتاب ✨</div></div>

<script>
const $=s=>document.querySelector(s);let LIB,U,pi=0,z=1,curBtn=null,CB=null;

const show=id=>{document.querySelectorAll('.screen').forEach(e=>e.classList.remove('on'));$(id).classList.add('on');$('#gear').style.display=(id=='#shelf'||id=='#units')?'block':'none'};
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',5000)};
$('#cover').onclick=async()=>{$('#cover').classList.add('open');try{const r=await fetch('data/library.json?t='+Date.now());if(!r.ok)throw 0;LIB=await r.json()}catch(e){$('#cover').classList.remove('open');toast('مش قادر أحمّل الكتاب. افتحيه من رابط GitHub Pages (مش من الملف على الجهاز).');return}setTimeout(shelf,1400)};
const cv=b=>b.cover&&(!isB2(b.cover)||SIGNED[b.cover]||PREV[b.cover])?surl(b.cover):'';

 d.innerHTML=(cv(b)?`<img src="${cv(b)}" alt="" style="width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;display:block;margin-bottom:8px">`:'<b>📘</b>')+`<div style="font-weight:700">${b.title}</div><small style="opacity:.8">${[b.level,n+' units'].filter(Boolean).join(' · ')}</small>`;d.onclick=()=>units(b);g.appendChild(d)});show('#shelf');signCovers()}
function units(b){CB=b;$('#bt').textContent=b.title;const g=$('#ugrid');g.innerHTML='';b.units.filter(u=>!u.hidden).forEach(u=>{const d=document.createElement('div');d.className='card';d.innerHTML=`<b>${u.num}</b>${u.title}`;d.onclick=()=>openUnit(u);g.appendChild(d)});show('#units')}
async function openUnit(u){if(!u.pages.length){toast('الوحدة دي لسه ما فيهاش صفحات');return}if(!(await ensureAccess(u)))return;U=u;pi=0;z=1;show('#reader');
 $('#bar').innerHTML=`<button class="g" id="bb">☰</button><b>Unit ${u.num}: ${u.title}</b><div id="lsn"></div><span id="pb"></span><select id="sel">${u.pages.map((p,i)=>`<option value="${i}">${p.lesson?E(p.lesson)+' · ':''}${plab(p)}</option>`).join('')}</select><span class="sp"></span>

 $('#bb').onclick=()=>{stopAu();penSet(false);show('#units')};$('#sel').onchange=e=>{pi=+e.target.value;draw()};
 $('#bA').onclick=()=>setAll(true);$('#bN').onclick=()=>setAll(false);

 $('#bAu').onclick=()=>{au.paused?au.play():au.pause()};$('#bSt').onclick=studentDlg;$('#bPen').onclick=()=>penSet(!penOn);draw()}
function go(d){const n=Math.max(0,Math.min(U.pages.length-1,pi+d));if(n!=pi){pi=n;draw()}}
const src=p=>surl(p.url);
let ACT={pend:null,done:new Set(),tot:0,hs:[],st:null,tgt:false};
function renderPage(st,p){st.innerHTML=`<img src="${src(p)}" alt="">`+decoSVG(p.hs)+'<svg class="deco" id="lnk" viewBox="0 0 80 100"></svg>';
 ACT={pend:null,done:new Set(),tot:0,hs:p.hs,st,tgt:p.hs.some(h=>h.k=='target')};let aq=null;

  const b=mk(h);b.dataset.i=i;st.appendChild(b);if(h.k=='target')ACT.tot++;if(h.show&&/circle|blank|note/.test(h.k))tog(b,true);if(h.auto&&h.k=='audio'&&h.m)aq=[h.m,b]});
 if(ACT.tot){const c=document.createElement('div');c.id='achip';c.className='chip';st.appendChild(c);actUpd()}
 st.onclick=e=>{if(!ACT.tgt||e.target.closest('.h'))return;const r=st.getBoundingClientRect(),m=document.createElement('div');m.className='h xmark';m.style.left=((e.clientX-r.left)/r.width*100)+'%';m.style.top=((e.clientY-r.top)/r.height*100)+'%';m.textContent='✗';st.appendChild(m);setTimeout(()=>m.remove(),650);rec({}, {t:'Find & tap activity'},false,'miss')};
 return aq}
const plab=p=>(p.part=='wb'?'WB ':'Page ')+p.label;
function lsnUpd(){const p=U.pages[pi],ls=[...new Set(U.pages.map(x=>x.lesson||''))].filter(Boolean),box=$('#lsn');if(box){box.innerHTML=ls.map(l=>`<button class="g lc${(p.lesson||'')==l?' on':''}" data-l="${E(l)}">${E(l)}</button>`).join('');box.querySelectorAll('.lc').forEach(b=>b.onclick=()=>{const i=U.pages.findIndex(x=>(x.lesson||'')==b.dataset.l);if(i>=0){pi=i;draw()}});const on=box.querySelector('.on');on&&on.scrollIntoView&&on.scrollIntoView({block:'nearest',inline:'center'})}

function mkLink(h,i){return[['a',h.x,h.y],['b',h.x2,h.y2]].map(([e,x,y])=>{const b=document.createElement('button');b.className='h dot';b.style.left=x+'%';b.style.top=y+'%';b.dataset.l=i;b.dataset.e=e;if(h.c)b.style.setProperty('--c',h.c);b.onclick=ev=>{ev.stopPropagation();dotTap(b,h,i)};return b})}

 else{const pos=x=>({x:parseFloat(x.style.left),y:parseFloat(x.style.top)}),n=lineAt(pos(p),pos(b),'bad');setTimeout(()=>n&&n.remove(),700);rec(h,{t:'Matching activity'},false,'')}}

/* pen */
const PEN={};let penOn=false,penCol='#e5173f',penW=5,penHl=false;
function penInit(st){const c=document.createElement('canvas');c.id='pen';st.appendChild(c);let cur=null;const pt=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]};

function decoSVG(hs){const sh=hs.filter(h=>h.k=='shape');if(!sh.length)return '';
 return `<svg class="deco" viewBox="0 0 80 100">${sh.map(h=>{const c=h.c||'#e5173f',w=(h.th||5)*.12,op=(h.op||0)/100,x=h.x*.8,y=h.y,W=h.w*.8,H=h.h;
  if(h.sh=='ellipse')return `<ellipse cx="${x+W/2}" cy="${y+H/2}" rx="${W/2}" ry="${H/2}" fill="${c}" fill-opacity="${op}" stroke="${c}" stroke-width="${w}"/>`;
  if(h.sh=='arrow'){const d=h.dir||'se',ex=d.includes('e')?x+W:x,ey=d.includes('s')?y+H:y,sx=d.includes('e')?x:x+W,sy=d.includes('s')?y:y+H,a=Math.atan2(ey-sy,ex-sx),L=Math.max(2,(h.th||5)*.55),p=n=>`${ex-L*Math.cos(a+n)},${ey-L*Math.sin(a+n)}`;
   return `<line x1="${sx}" y1="${sy}" x2="${ex-L*.6*Math.cos(a)}" y2="${ey-L*.6*Math.sin(a)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/><polygon points="${ex},${ey} ${p(.45)} ${p(-.45)}" fill="${c}"/>`}
  return `<rect x="${x}" y="${y}" width="${W}" height="${H}" rx=".5" fill="${c}" fill-opacity="${op}" stroke="${c}" stroke-width="${w}"/>`}).join('')}</svg>`}
