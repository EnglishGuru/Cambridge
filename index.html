<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cambridge Interactive Book</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="data/library.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;height:100vh;overflow:hidden;font-family:system-ui,Segoe UI,Tahoma,sans-serif;background:radial-gradient(circle at 50% 30%,#12507a,#07243a 70%);color:#fff}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center}.screen.on{display:flex}
#cover{perspective:1600px;cursor:pointer}
.bookcover{width:min(80vw,460px);aspect-ratio:3/4;background:linear-gradient(135deg,#0b3a5c,#0f6a8f);border:3px solid #e8c46a;border-radius:6px 18px 18px 6px;box-shadow:0 30px 70px #000a,inset 14px 0 24px #0006;display:flex;flex-direction:column;align-items:center;justify-content:center;transform-origin:left center;transition:transform 1.6s cubic-bezier(.6,0,.3,1),opacity 1.6s}
.bookcover h1{font:700 clamp(36px,8vw,64px) Georgia,serif;margin:0;background:linear-gradient(90deg,#b8862b,#ffe9a3,#b8862b);background-size:200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 3s linear infinite}
@keyframes sh{to{background-position:-200%}}
.bookcover p{color:#cfe8f5;letter-spacing:.3em;font-size:14px}
.hint{margin-top:26px;color:#e8c46a;animation:pl 1.6s infinite}@keyframes pl{50%{opacity:.35}}
#cover.open .bookcover{transform:rotateY(-110deg);opacity:0}
h2{font:700 32px Georgia,serif;color:#ffe9a3;margin:0 0 22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,190px));gap:18px;justify-content:center;max-width:900px;padding:0 16px}
.card{padding:26px 10px;border-radius:14px;text-align:center;background:linear-gradient(135deg,#0f8fb0,#0b5f87);border:2px solid #e8c46a;cursor:pointer;box-shadow:0 8px 24px #0006;transition:.2s}
.card:hover{transform:translateY(-5px) scale(1.04)}.card b{display:block;font-size:34px}
#login input{display:block;margin:8px 0;padding:10px;width:260px;border-radius:8px;border:0;font-size:16px}
button{font-family:inherit}
#reader{justify-content:flex-start}
#bar{width:100%;height:50px;display:flex;gap:8px;align-items:center;padding:0 10px;background:#000000aa;flex:none}
#bar button,#bar select{font:600 15px inherit;font-family:inherit;padding:7px 13px;border:0;border-radius:9px;background:#e8c46a;color:#07243a;cursor:pointer}
#bar .g{background:#ffffff26;color:#fff}#bar .sp{flex:1}
#wrap{flex:1;width:100%;min-height:0;overflow:auto;display:flex;position:relative}
#st{position:relative;margin:auto;flex:none;background:#fff;box-shadow:0 0 40px #000a}
#st img{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none;animation:in .35s}
@keyframes in{from{opacity:0;transform:translateX(3%)}}
.nv{position:fixed;top:50%;transform:translateY(-50%);width:54px;height:90px;border:0;border-radius:12px;background:#000a;color:#fff;font-size:30px;cursor:pointer;z-index:5;opacity:.45}.nv:hover{opacity:1}
#pv{left:6px}#nx{right:6px}
.h{position:absolute;border:0;padding:0;background:none;cursor:pointer}
.circle{border-radius:50%;border:0 solid #e5173f}.circle:hover{background:#ffd54a2a}
.circle.on{border-width:calc(var(--u)*.55);box-shadow:0 0 calc(var(--u)*1.5) #e5173f99}
.blank,.note{transform:translate(-50%,-50%);font-size:calc(var(--u)*1.7);line-height:1.3;padding:0 .3em;border-radius:99px;background:#ffb400e6;box-shadow:0 1px 4px #0005}
.blank.on{background:#fff;color:#0a7a2f;font:700 calc(var(--u)*2.1)/1.25 system-ui;white-space:nowrap;box-shadow:0 0 0 calc(var(--u)*.3) #0a7a2f;animation:in .3s}
.note{z-index:2}.note.on{background:#ffb400}
.bub{position:absolute;top:135%;left:-1em;z-index:9;width:max-content;max-width:calc(var(--u)*46);background:#fffbe6;color:#12263a;border:calc(var(--u)*.3) solid #e8c46a;border-radius:calc(var(--u)*1);padding:calc(var(--u)*1) calc(var(--u)*1.4);font:500 calc(var(--u)*2.2)/1.35 system-ui;text-align:left;cursor:default;white-space:normal}
.bub.r{left:auto;right:-1em}
.audio{width:6.5%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);border:calc(var(--u)*.45) solid #e8c46a;background:#e8c46a33;animation:rg 1.8s infinite}
.audio.play{background:#e8c46acc;animation:none}@keyframes rg{50%{box-shadow:0 0 0 calc(var(--u)*1) #e8c46a55}}
.video{border:calc(var(--u)*.4) solid #e8c46a;border-radius:calc(var(--u)*1);background:#e8c46a33;animation:rg 1.8s infinite}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#000d;padding:10px 18px;border-radius:10px;display:none;z-index:20}
#modal{position:fixed;inset:0;background:#000e;display:none;align-items:center;justify-content:center;z-index:15}
#modal video{max-width:92vw;max-height:86vh}#modal span{position:absolute;top:14px;right:22px;font-size:36px;cursor:pointer}
</style></head><body>
<div id="cover" class="screen on"><div class="bookcover"><h1>Cambridge</h1><p>ENGLISH · INTERACTIVE BOOK</p></div><div class="hint">اضغطي لفتح الكتاب ✨</div></div>
<div id="login" class="screen"><h2>Login</h2><input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password"><button id="lgo" class="card" style="padding:10px 30px;color:#fff">Login</button></div>
<div id="shelf" class="screen"><h2>Books</h2><div class="grid" id="bgrid"></div></div>
<div id="units" class="screen"><h2 id="bt"></h2><div class="grid" id="ugrid"></div><button class="card" style="margin-top:22px;padding:10px 24px;color:#fff" onclick="shelf()">◀ Books</button></div>
<div id="reader" class="screen"><div id="bar"></div><div id="wrap"><div id="st"></div></div>
<button class="nv" id="pv" onclick="go(-1)">‹</button><button class="nv" id="nx" onclick="go(1)">›</button></div>
<div id="toast"></div><div id="modal"><span onclick="closeVid()">×</span><video id="vp" controls></video></div>
<script>
const $=s=>document.querySelector(s);let LIB,sb,U,pi=0,z=1,curBtn=null,curBook=null;const au=new Audio(),ZS=[1,1.5,2.2];
const show=id=>{document.querySelectorAll('.screen').forEach(e=>e.classList.remove('on'));$(id).classList.add('on')};
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',4000)};
$('#cover').onclick=async()=>{$('#cover').classList.add('open');try{LIB=await loadLib()}catch(e){toast('Error: '+(e.message||e));return}setTimeout(shelf,1400)};
function login(){return new Promise(res=>{show('#login');$('#lgo').onclick=async()=>{const r=await sb.auth.signInWithPassword({email:$('#em').value,password:$('#pw').value});r.error?toast(r.error.message):res()}})}
async function loadLib(){
 if(!CFG.url)return window.LIB;
 sb=supabase.createClient(CFG.url,CFG.key);
 let{data:{session}}=await sb.auth.getSession();
 while(!session){await login();({data:{session}}=await sb.auth.getSession())}
 const q=t=>sb.from(t).select('*').then(r=>{if(r.error)throw r.error;return r.data});
 const[b,u,p,h]=await Promise.all(['books','units','pages','hotspots'].map(q));
 const o=(a,k)=>a.sort((x,y)=>(x[k]??0)-(y[k]??0));
 return{books:o(b,'sort').map(bk=>({title:bk.title,units:o(u.filter(x=>x.book_id==bk.id),'num').map(un=>({num:un.num,title:un.title,pages:o(p.filter(x=>x.unit_id==un.id),'sort').map(pg=>({label:pg.label,path:pg.path,hs:h.filter(x=>x.page_id==pg.id).map(x=>({k:x.kind,x:x.x,y:x.y,w:x.w,h:x.h,a:x.answer,mp:x.path}))}))}))}))}}
async function sign(u){if(!sb)return;const ps=[...new Set([...u.pages.map(p=>p.path),...u.pages.flatMap(p=>p.hs.map(h=>h.mp))].filter(Boolean))];
 const{data}=await sb.storage.from('media').createSignedUrls(ps,7200);const m={};data.forEach(d=>m[d.path]=d.signedUrl);
 u.pages.forEach(p=>{p.url=m[p.path];p.hs.forEach(h=>h.m=m[h.mp])})}
function shelf(){const g=$('#bgrid');g.innerHTML='';LIB.books.forEach(b=>{const d=document.createElement('div');d.className='card';d.innerHTML=`<b>📘</b>${b.title}`;d.onclick=()=>units(b);g.appendChild(d)});show('#shelf')}
function units(b){curBook=b;$('#bt').textContent=b.title;const g=$('#ugrid');g.innerHTML='';b.units.forEach(u=>{const d=document.createElement('div');d.className='card';d.innerHTML=`<b>${u.num}</b>${u.title}`;d.onclick=()=>openUnit(u);g.appendChild(d)});show('#units')}
async function openUnit(u){try{await sign(u)}catch(e){toast(e.message);return}U=u;pi=0;z=1;show('#reader');
 $('#bar').innerHTML=`<button class="g" id="bb">☰</button><b>Unit ${u.num}: ${u.title}</b><select id="sel">${u.pages.map((p,i)=>`<option value="${i}">Page ${p.label}</option>`).join('')}</select><span class="sp"></span>
 <button id="bAu" class="g" style="display:none">⏸ Pause</button><button id="bA">👁 Reveal All</button><button id="bN" class="g">Hide All</button><button id="bZ" class="g">🔍</button><button id="bF" class="g">⛶</button>`;
 $('#bb').onclick=()=>{stopAu();show('#units')};$('#sel').onchange=e=>{pi=+e.target.value;draw()};
 $('#bA').onclick=()=>setAll(true);$('#bN').onclick=()=>setAll(false);
 $('#bZ').onclick=()=>{z=ZS[(ZS.indexOf(z)+1)%ZS.length];fit()};
 $('#bF').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
 $('#bAu').onclick=()=>{au.paused?au.play():au.pause()};draw()}
function go(d){const n=Math.max(0,Math.min(U.pages.length-1,pi+d));if(n!=pi){pi=n;draw()}}
function draw(){stopAu();const p=U.pages[pi],st=$('#st');st.innerHTML=`<img src="${p.url}" alt="">`;p.hs.forEach(h=>st.appendChild(mk(h)));$('#sel').value=pi;fit()}
function fit(){const w=$('#wrap'),H=Math.min(w.clientHeight,w.clientWidth/.8)*z,st=$('#st');st.style.height=H+'px';st.style.width=H*.8+'px';st.style.setProperty('--u',H/100+'px')}
function mk(h){const b=document.createElement('button');b.className='h '+h.k;b.style.left=h.x+'%';b.style.top=h.y+'%';b.dataset.a=h.a||'';b.dataset.k=h.k;
 if(h.k=='circle'||h.k=='video'){b.style.width=h.w+'%';b.style.height=h.h+'%'}
 if(h.k=='audio')b.onclick=()=>play(h.m,b);
 else if(h.k=='video')b.onclick=()=>vid(h.m);
 else{b.onclick=()=>tog(b);if(h.k!='circle')b.textContent='👁'}
 return b}
function tog(b,f){const on=f===undefined?!b.classList.contains('on'):f,k=b.dataset.k;b.classList.toggle('on',on);
 if(k=='blank')b.textContent=on?b.dataset.a:'👁';
 if(k=='note'){const o=b.querySelector('.bub');if(o)o.remove();if(on){const d=document.createElement('div');d.className='bub'+(parseFloat(b.style.left)>50?' r':'');d.innerHTML=b.dataset.a;d.onclick=e=>e.stopPropagation();b.appendChild(d)}}}
function setAll(on){document.querySelectorAll('#st .h').forEach(b=>{if(b.dataset.k=='circle'||b.dataset.k=='blank')tog(b,on);else if(!on&&b.dataset.k=='note')tog(b,false)})}
function upd(){document.querySelectorAll('.audio').forEach(b=>b.classList.toggle('play',b===curBtn&&!au.paused));const t=$('#bAu');if(!t)return;t.style.display=curBtn?'':'none';t.textContent=au.paused?'▶ Resume':'⏸ Pause'}
au.onplay=au.onpause=upd;au.onended=()=>{curBtn=null;upd()};
function stopAu(){au.pause();curBtn=null;upd()}
function play(src,b){if(curBtn===b){au.paused?au.play():au.pause();return}au.pause();curBtn=b;au.src=src;au.play().catch(()=>{toast('ملف الصوت مش موجود: '+src);curBtn=null;upd()})}
function vid(s){const v=$('#vp');v.src=s;$('#modal').style.display='flex';v.play().catch(()=>toast('الفيديو مش موجود'))}
function closeVid(){const v=$('#vp');v.pause();v.removeAttribute('src');$('#modal').style.display='none'}
addEventListener('keydown',e=>{if(!U||!$('#reader').classList.contains('on'))return;if(e.key=='ArrowRight'||e.key=='PageDown')go(1);if(e.key=='ArrowLeft'||e.key=='PageUp')go(-1);if(e.key==' '&&curBtn){e.preventDefault();au.paused?au.play():au.pause()}});
addEventListener('resize',()=>U&&fit());
let tx=0;$('#wrap').addEventListener('touchstart',e=>tx=e.touches[0].clientX);$('#wrap').addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;if(z==1&&Math.abs(d)>80)go(d<0?1:-1)});
</script></body></html>
